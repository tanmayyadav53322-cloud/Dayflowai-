<script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"DayFlow AI","applicationCategory":"ProductivityApplication","operatingSystem":"Web","description":"AI daily planner that turns goals, tasks and calendar commitments into a realistic schedule."}</script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f6;--card:#fff;--ink:#12242b;--mute:#5d7078;--line:#dbe4e6;--acc:#1f6f6a;--accT:#fff;--hot:#e8a317;--hi:#d64545;--md:#d99a1e;--lo:#3a9b66;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1e;--card:#162429;--ink:#e8f1f2;--mute:#93a8ae;--line:#26393f;--acc:#4fb8b0;--accT:#08201f}}
:root[data-theme="dark"]{--bg:#0e1a1e;--card:#162429;--ink:#e8f1f2;--mute:#93a8ae;--line:#26393f;--acc:#4fb8b0;--accT:#08201f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0;line-height:1.1}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.logo{font:700 20px 'Bricolage Grotesque',sans-serif}.logo i{color:var(--acc);font-style:normal}
h1{font-size:clamp(34px,8vw,54px);font-weight:700;letter-spacing:-.02em}
.sub{color:var(--mute);margin:12px 0 22px;max-width:52ch}
textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:14px;font:inherit;resize:vertical}
textarea:focus,button:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{font:600 15px Figtree,sans-serif;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 16px;cursor:pointer;min-height:44px}
button.p{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}
.tl{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:20px 58px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}.it.done .t{text-decoration:line-through;color:var(--mute)}
.it.skipped,.it.moved{opacity:.5}
.tm{font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px}
.t{font-weight:600}.d{font-size:13px;color:var(--mute)}
.dot{width:12px;height:12px;border-radius:50%;border:0;padding:0;min-height:0;cursor:pointer}
.ck{width:20px;height:20px;accent-color:var(--acc)}
.x{border:0;background:none;color:var(--mute);padding:4px 8px;min-height:0}
.warn{border-color:var(--hi)}.warn h3{color:var(--hi)}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin:10px 0}.stats b{font:700 26px 'Bricolage Grotesque',sans-serif;display:block}
.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden;margin:16px 0}.bar span{display:block;height:100%;background:var(--hot);transition:width .4s}
.big{font:700 clamp(28px,7vw,42px) 'Bricolage Grotesque',sans-serif}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.why{font-size:14px;color:var(--mute);margin-top:10px}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font:700 18px 'Bricolage Grotesque'}
.ring span{background:var(--card);width:64px;height:64px;border-radius:50%;display:grid;place-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
:root:root:root{--bg:#0a1418;--card:#121f25;--ink:#e9f2f3;--mute:#8fa5ab;--line:#22343b;--acc:#3cc4bb;--accT:#04201e;--hot:#3cc4bb;--hi:#ef6b6b;--md:#eaa43a;--lo:#52c28b}
main{padding-bottom:110px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute)}nav button.on{color:var(--acc)}
.fab{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--acc);color:var(--accT);border-radius:26px;padding:0 18px}
#coach{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
#coach[hidden]{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:10;max-width:90%;font-size:14px;animation:in .2s}
@keyframes in{from{opacity:0;transform:translate(-50%,8px)}}
.bk{display:flex;gap:6px;align-items:flex-end;height:90px}.bk i{flex:1;background:var(--acc);border-radius:6px 6px 0 0;min-width:8px}
.it.done .ck{animation:pop .25s}@keyframes pop{50%{transform:scale(1.3)}}
html[data-theme="light"]:root:root{--bg:#f3f7f8;--card:#fff;--ink:#12242b;--mute:#566a72;--line:#d5e0e3}
nav button{font-size:12px;padding:0 2px}
.cal{position:relative;margin:14px 0 14px 48px;border-left:1px solid var(--line)}.blk{position:absolute;left:8px;right:4px;border-radius:8px;padding:3px 8px;font-size:12px;overflow:hidden;background:var(--acc);color:var(--accT)}.blk.ev{background:var(--card);border:1.5px dashed var(--mute);color:var(--ink)}.hr{position:absolute;left:-46px;font-size:11px;color:var(--mute)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.mg div{min-height:48px;border:1px solid var(--line);border-radius:8px;padding:3px;font-size:11px}.mg .td{border-color:var(--acc);color:var(--acc)}
@media(min-width:900px){body{padding-left:210px}nav{top:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:20px 10px}nav button{text-align:left;padding:0 14px;font-size:15px}.fab{bottom:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a1418"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"></head><body><main>
<header><div class="logo">Day<i>Flow</i> AI <span class="d" id="acc" style="font:400 12px Figtree"></span></div><button id="reset" aria-label="Start over">Start over</button></header>
<div id="app"></div></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEMO="Tomorrow I wake up at 7 AM. I need to study mathematics for 2 hours, go to college from 10 AM to 2 PM, complete my project for 2 hours, exercise for 45 minutes, buy groceries, call my parents and sleep by 11 PM.";
const fresh=()=>({rec:[],prop:null,goals:[],name:'',onb:0,fq:null,add:false,wp:0,brain:{goals:[],deadlines:[],habits:[],dur:{}},cal:{events:[],last:null},wk:null,nw:null,itab:'today',wasOver:false,pv:null,undo:null,dis:'',pref:{wake:420,sleep:1380,dd:45,energy:'none',notif:false,mode:'',challenge:''},notified:[],hist:[],logged:0,sug:null,stage:'plan',text:'',items:[],over:null,wake:420,sleep:1380,carry:[],cur:0,el:0,run:true,fast:true,mood:null,block:null});
let S=fresh();
try{const r=localStorage.getItem('dayflow');if(r)S=Object.assign(fresh(),JSON.parse(r))}catch(e){}
if(S.hist.length||S.items.length)S.onb=1;
let cref=null,pt=null,ACC={s:'checking',last:null};
const save=()=>{S.ts=Date.now();try{localStorage.setItem('dayflow',JSON.stringify(S))}catch(e){}push()};
const fmt=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const dur=m=>m>=60?(Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':'')):m+'m';
const PC={high:'var(--hi)',med:'var(--md)',low:'var(--lo)',opt:'var(--mute)'},LBL={high:'Critical',med:'Important',low:'Flexible',opt:'Optional'};

/* ---- Planner (rule-based stand-in for the server-side AI call in lib/ai/planner.ts) ---- */
function toMin(h,m,ap,pmGuess){h=+h;m=+(m||0);if(ap){ap=ap.toLowerCase();if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0}else if(pmGuess&&h<7)h+=12;return h*60+m}
const T='(\\d{1,2})(?::(\\d\\d))?\\s*(am|pm)?';
function parse(text){
  let wake=S.pref.wake,sleep=S.pref.sleep,fixed=[],flex=[],id=0;
  text.replace(/\btomorrow\b/ig,'').split(/[,.;]|\band\b/i).map(s=>s.trim()).filter(Boolean).forEach(c=>{
    const one=new RegExp('at '+T,'i'),rg=new RegExp(T+'\\s*(?:to|-|until)\\s*'+T,'i');
    if(/\bwake/i.test(c)){const m=c.match(one);if(m)wake=toMin(m[1],m[2],m[3]);return}
    if(/\b(sleep|bed)\b/i.test(c)){const m=c.match(new RegExp(T+'\\s*$','i'))||c.match(one);if(m)sleep=toMin(m[1],m[2],m[3]||'pm');return}
    let title=c.replace(/^(i\s+)?(need|have|want|should|must|also)?\s*(to)?\s*/i,'').replace(/^(i\s+)?(need|want|have)\s+to\s+/i,'');
    const r=c.match(rg);
    if(r){let s=toMin(r[1],r[2],r[3]||(r[6]?null:undefined),!r[3]&&!r[6]),e=toMin(r[4],r[5],r[6]);
      if(!r[3]&&r[6]&&s>e)s-=720; if(e<=s&&!r[6])e+=720;
      title=title.replace(rg,'').replace(/\b(from|at)\b\s*$/i,'').replace(/^\s*(go to|attend)\s+/i,'').trim()||'Fixed event';
      fixed.push({title:cap(title),start:s,dur:e-s,pri:'high',fixed:true,id:id++});return}
    const d=c.match(/(\d+(?:\.\d+)?)\s*(hours?|hrs?|h|minutes?|mins?)\b/i);let n;
    if(d){n=Math.round(+d[1]*(/^h/i.test(d[2])?60:1));title=title.replace(/\bfor\s+\d+(?:\.\d+)?\s*\w+/i,'')}
    else n=/gym|exercise|workout/i.test(c)?45:/call/i.test(c)?20:/grocer|buy/i.test(c)?45:/study|project|assignment|read/i.test(c)?90:S.pref.dd;
    title=title.replace(/^go (for|to)\s*(the )?/i,'').trim();
    const pri=/study|project|assignment|exam|finish|complete|work/i.test(c)?'high':/gym|exercise|workout|read/i.test(c)?'med':'low';
    flex.push({title:cap(title||c),dur:n,pri,id:id++,fixed:false,explicit:!!d});
  });
  return {wake,sleep,fixed,flex};
}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function build(p,carryNote){
  const {wake,sleep,fixed,flex}=p,items=[];let n=100;
  const add=(o)=>items.push(Object.assign({status:'pending',spent:0,id:n++},o));
  add({title:'Wake up',start:wake,dur:15,pri:'low',cat:'routine',why:'Starts at your wake-up time.'});
  add({title:'Morning routine',start:wake+15,dur:30,pri:'low',why:'A calm start before the first task.'});
  fixed.forEach(f=>add(Object.assign(f,{why:f.cal?'Calendar event: busy time, never moved.':'Fixed commitment, protected from changes.'})));
  const end=sleep-30;
  let blocks=[{s:wake+45,e:end}];
  fixed.slice().sort((a,b)=>a.start-b.start).forEach(f=>{blocks=blocks.flatMap(b=>{const fe=f.start+f.dur;if(fe<=b.s||f.start>=b.e)return[b];const o=[];if(f.start-10>b.s)o.push({s:b.s,e:f.start-10});if(fe+10<b.e)o.push({s:fe+10,e:b.e});return o})});
  const avail=blocks.reduce((a,b)=>a+b.e-b.s,0),req=flex.reduce((a,t)=>a+t.dur,0);
  const rank={high:0,med:1,low:2},left=[];
  flex.slice().sort((a,b)=>rank[a.pri]-rank[b.pri]).forEach(t=>{
    const b=(t.pri==='high'?ord(blocks):blocks).find(b=>b.e-b.s>=t.dur);
    if(!b){left.push(t);return}
    add(Object.assign(t,{start:b.s,why:(t.note?t.note+' ':'')+(t.pri==='high'?'High priority, placed in the first open window.':'Fits around your commitments with a 10 min buffer.')}));b.s+=t.dur+10;
  });
  add({title:'Wind down',start:end,dur:30,pri:'low',why:'Protects your sleep time.'});
  add({title:'Sleep',start:sleep,dur:30,pri:'low',why:'Your target bedtime.'});
  items.sort((a,b)=>a.start-b.start);
  return {items,over:left.length?{avail,req,left,over:Math.max(0,req-avail)}:null};
}
function ord(bl){const e=S.pref.energy!=='none'?S.pref.energy:(pats().best||'none'),m=e==='afternoon'?720:e==='evening'?1020:0;return m?[...bl.filter(b=>b.e>m+60),...bl.filter(b=>b.e<=m+60)]:bl}
function generate(){
  const t=$('#txt').value.trim();
  if(t.length<10){$('#err').textContent='Add a few more details, for example "study 2 hours, gym 45 minutes, sleep by 11 PM".';return}
  const p=parse(t);calFix(p);recFx(p);brainFx(p);const pn=p.flex.filter(t=>t.note).length;if(pn)setTimeout(()=>toast(`Personalized ${pn} task${pn>1?'s':''}. The reason is under each task.`),400);S.text=t;S.wake=p.wake;S.sleep=p.sleep;
  if(!p.fixed.length&&!p.flex.length){$('#err').textContent='I could not find any tasks. Try separating them with commas.';return}
  const r=build(p);S.prop={items:r.items,over:r.over};save();render();
}

/* ---- Views ---- */
const done=()=>S.items.filter(i=>i.status==='done').length;
const tasks=()=>S.items.filter(i=>!i.cal&&!['Wake up','Sleep','Morning routine','Wind down'].includes(i.title));
function ring(){const t=tasks(),d=t.filter(i=>i.status==='done').length,p=t.length?Math.round(d/t.length*100):0;
  return `<div class="ring" style="background:conic-gradient(var(--acc) ${p*3.6}deg,var(--line) 0)"><span>${p}%</span></div>`}
function timeline(edit){return `<div class="tl">`+S.items.map((i,k)=>`<div class="it ${i.status}">
 <input class="ck" type="checkbox" ${i.status==='done'?'checked':''} aria-label="Complete ${esc(i.title)}" onchange="tog(${k})">
 <span class="tm">${fmt(i.start)}</span>
 <div><div class="t">${esc(i.title)}</div><div class="d">${LBL[i.pri]} · ${dur(i.dur)}${i.fixed?(i.cal?' · calendar':' · fixed'):''}${edit&&i.why?' · '+esc(i.why):''}</div></div>
 <span>${edit?`<button class="dot" style="background:${PC[i.pri]}" title="Priority: ${i.pri}. Tap to change" aria-label="Change priority, now ${i.pri}" onclick="pri(${k})"></button><button class="x" aria-label="Remove ${esc(i.title)}" onclick="del(${k})">✕</button>`:`<span class="dot" style="background:${PC[i.pri]};display:inline-block"></span>`}</span></div>`).join('')+`</div>`}
function render(){
  const a=$('#app');
  if(RECOV)return recovView(a);
  if(sb&&ACC.s==='checking'){a.innerHTML='<p class="d">Loading…</p>';return}
  if(sb&&!user&&!S.guest)return authView(a);
  if(!S.onb)return onbView(a);
  if(S.stage==='cal')return calView(a);
  if(S.stage==='goals'){goalsView(a);a.insertAdjacentHTML('beforeend',archBox());return}
  if(S.stage==='exec')return execView(a);
  if(S.stage==='review')return reviewView(a);
  if(S.stage==='insights')return insightsView(a);
  if(S.stage==='settings')return setView(a);
  const has=S.items.length;
  a.innerHTML=`${has?'':`<h1>Your day. Planned by AI.</h1><p class="sub">DayFlow AI turns your goals, tasks and schedule into a realistic plan, and adapts when life changes.</p>`}
  <label class="d" for="txt">Tell DayFlow what you need to do tomorrow</label>
  <textarea id="txt" placeholder="I have college from 10 to 2, need to study for 3 hours, workout for 1 hour, finish my assignment, buy groceries and sleep by 11 PM.">${esc(S.text)}</textarea>
  <div id="err" class="d" style="color:var(--hi);margin-top:6px" role="alert"></div>
  <div class="row"><button class="p" onclick="generate()">${has?'Regenerate plan':'Start planning free'}</button>${has?'':'<button onclick="document.getElementById(\'how\').scrollIntoView()">See how it works</button>'}<button onclick="$('#txt').value=DEMO">Use Rahul's example</button><button onclick="voice('txt',this)">🎤 Speak</button></div>
  ${propBox()}${has?planView():`<div class="card" id="how"><h3>How it works</h3><p class="sub" style="margin:8px 0 0">Describe your day. DayFlow finds fixed commitments, estimates durations, adds buffers, and warns you when the plan will not fit.</p></div>`}`;
}
function planView(){
  let o='';
  if(S.over){const v=S.over;o=`<div class="card warn" role="alert"><h3>Your plan is overloaded.</h3>
  <div class="stats"><div><b>${dur(v.avail)}</b>available</div><div><b>${dur(v.req)}</b>required</div><div><b>${dur(v.over)}</b>over</div></div>
  <p class="d">Could not fit: ${v.left.map(t=>esc(t.title)).join(', ')}. What should I prioritize?</p>
  <p class="d">To make this day realistic I recommend:</p><ul class="d"><li>Keep fixed events and Critical tasks</li>${v.left.map(t=>`<li>Move ${esc(t.title)} (${dur(t.dur)}) to tomorrow</li>`).join('')}</ul><div class="row"><button class="p" onclick="trim()">Apply suggestions</button><button onclick="S.over=null;save();render()">Edit myself</button></div></div>`}
  return alertBox()+brief()+o+`<div class="card"><div class="top"><div><h3>Tomorrow's plan</h3><div class="d">Tap a dot to change priority. Edit before you start.</div></div>${ring()}</div>${timeline(true)}</div>
  <div class="row"><button class="p" onclick="start()">Start my day</button></div>`}
function trim(){S.carry=S.over.left.map(t=>({title:t.title,dur:t.dur}));S.over=null;save();render()}
function tog(k){const i=S.items[k];i.status=i.status==='done'?'pending':'done';save();render()}
function pri(k){const o=['high','med','low','opt'],i=S.items[k];i.pri=o[(o.indexOf(i.pri)+1)%3];save();render()}
function del(k){const x=S.items[k];if(x.cal)S.cal.events=S.cal.events.filter(e=>'c'+e.uid!==x.id);S.items.splice(k,1);save();render()}
function start(){S.stage='exec';S.el=0;S.run=true;save();render()}

let tick;
function curIdx(){return S.items.findIndex(i=>i.status==='pending')}
function execView(a){
  clearInterval(tick);const k=curIdx();
  if(k<0){S.stage='review';save();return render()}
  const i=S.items[k],nx=S.items.filter((x,j)=>j>k&&x.status==='pending').slice(0,3);
  a.innerHTML=`${S.sug?sugBox():''}${S.fq?fqBox():''}${behindBox()}<div class="top"><div class="d">Current task</div>${ring()}</div>
  <div class="big" style="margin-top:6px">${esc(i.title)}</div>
  <div class="d">${fmt(i.start)} to ${fmt(i.start+i.dur)} · ${dur(i.dur)}</div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span id="pb"></span></div>
  <div class="d" id="pt"></div>
  <div class="row"><button class="p" onclick="fin(${k},'done')">Complete</button><button id="pz" onclick="S.run=!S.run;upd()">Pause</button><button onclick="plus5(${k})">+5 min</button><button onclick="fin(${k},'skipped')">Skip</button><button onclick="fin(${k},'moved')">Reschedule</button></div>
  <label class="d" style="display:block;margin-top:12px"><input type="checkbox" ${S.fast?'checked':''} onchange="S.fast=this.checked"> Demo speed (1 second = 1 minute)</label>
  <div class="card"><h3>Up next</h3><div class="tl">${nx.map(n=>`<div class="it" style="grid-template-columns:58px 1fr"><span class="tm">${fmt(n.start)}</span><span class="t">${esc(n.title)}</span></div>`).join('')||'<div class="d">Nothing else. Finish this and review your day.</div>'}</div></div>
  <div class="row"><button onclick="S.stage='plan';render()">Back to plan</button><button onclick="S.stage='review';save();render()">End day</button></div>`;
  upd();tick=setInterval(()=>{if(S.run){S.el+=S.fast?60:1;upd()}},1000);
}
function upd(){const k=curIdx();if(k<0||!$('#pb'))return;const i=S.items[k],p=Math.min(100,S.el/60/i.dur*100);
  $('#pb').style.width=p+'%';$('#pz').textContent=S.run?'Pause':'Resume';

  S.nw={ap:0,basis:P.best?'your best completion window':'a default morning window (not enough history)',d:['Monday','Tuesday','Wednesday','Thursday','Friday'].map((n,i)=>{const dt=new Date(m);dt.setDate(m.getDate()+i);return{n,w,ev:S.cal.events.filter(e=>e.date===ld(dt)).length,t:ts.filter((x,j)=>j%5===i)}}).filter(x=>x.t.length)};save();render()}
function nwBox(){const n=S.nw;if(!n)return'';return `<div class="card" style="border-color:var(--acc)"><h3>Suggested plan for next week</h3><p class="d">Based on ${n.basis}. ${n.ap?'':'Not applied yet.'}</p>${n.d.map(x=>`<div class="d"><b style="color:var(--ink)">${x.n}</b> · ${x.w}: ${x.t.map(esc).join(', ')}${x.ev?` (${x.ev} calendar event${x.ev>1?'s':''})`:''}</div>`).join('')}<div class="row">${n.ap?'<span class="d">Applied. Monday tasks are in your carry-over list.</span>':'<button class="p" onclick="applyNw()">Apply plan</button>'}<button onclick="S.nw=null;save();render()">Dismiss</button></div></div>`}
function applyNw(){const mo=S.nw.d.find(x=>x.n==='Monday');if(mo)mo.t.forEach(t=>{if(!S.carry.some(c=>c.title===t))S.carry.push({title:t,dur:S.pref.dd})});S.nw.ap=1;save();render();toast('Plan applied')}
function go(st){if(st==='exec'){if(!S.items.length)return toast('Create a plan first.');return start()}S.stage=st;save();render()}
/* Rule-based coach: proposes changes, applies only after confirmation. */
const NW={one:1,two:2,three:3,four:4,five:5,six:6};
function findT(s){return tasks().find(i=>i.status==='pending'&&i.title.toLowerCase().split(/\s+/).some(w=>w.length>3&&s.includes(w)))}
function ask(q){let s=q.toLowerCase().replace(/\b(one|two|three|four|five|six)\b/g,m=>NW[m]),ch=[],msg='',m;const t=findT(s);
  if((m=s.match(new RegExp('(?:move|push)\\s.*?\\bto\\s+'+T)))&&t){const st=toMin(m[1],m[2],m[3],true);ch.push({l:`${t.title} → ${fmt(st)}`,f:()=>{t.start=st;S.items.sort((a,b)=>a.start-b.start)}})}
  if((m=s.match(/(?:reduce|shorten|cut)\s.*?\bto\s+(\d+)\s*(hours?|h\b|min\w*|m\b)?/))&&t){const n=+m[1]*(/^h/.test(m[2]||'')?60:1);ch.push({l:`${t.title} → ${dur(n)}`,f:()=>{t.dur=n}})}
  if(/late|behind/.test(s)&&(m=s.match(/(\d+)\s*(hours?|hrs?|min\w*)/))){const n=+m[1]*(/^h/.test(m[2])?60:1);ch.push({l:`Shift flexible tasks ${dur(n)} later. Fixed events stay put; what no longer fits moves to tomorrow.`,f:()=>repack(n)})}
  if((m=s.match(/only\s+(\d+)\s*hours?/))){const b=+m[1]*60,fl=tasks().filter(i=>!i.fixed&&i.status==='pending').sort((a,b)=>'high med low opt'.indexOf(a.pri)-'high med low opt'.indexOf(b.pri));let u=0;const drop=fl.filter(i=>(u+=i.dur)>b);if(drop.length)ch.push({l:'Move to tomorrow: '+drop.map(i=>i.title).join(', '),f:()=>drop.forEach(i=>{i.status='moved';S.carry.push({title:i.title,dur:i.dur})})});else msg='Your flexible tasks already fit in that time.'}
  if(/heavy|busy|too much|overload/.test(s)){const l=tasks().filter(i=>!i.fixed&&i.status==='pending').sort((a,b)=>'opt low med high'.indexOf(a.pri)-'opt low med high'.indexOf(b.pri))[0];if(l)ch.push({l:`Move ${l.title} to tomorrow`,f:()=>{l.status='moved';S.carry.push({title:l.title,dur:l.dur})}})}
  if(/focus|first|priorit/.test(s)&&!ch.length){const n=tasks().find(i=>i.status==='pending'&&i.pri==='high')||tasks().find(i=>i.status==='pending');msg=n?`Start with ${n.title} (${fmt(n.start)}, ${dur(n.dur)}). It is your most important open task.`:'No open tasks. Nice work.'}
  const mm=new Date().getHours()*60+new Date().getMinutes(),pend=tasks().filter(i=>i.status==='pending'),miss=tasks().filter(i=>['skipped','moved'].includes(i.status)),dm=/\d+[-\s]*(day|week|month)/.test(s);
  if(/plan (my )?(day|tomorrow)/.test(s)){if(S.text)ch.push({l:'Generate a new plan from your last description',f:()=>{S.stage='plan';render();$('#txt').value=S.text;generate()}});else{msg='Describe your day in the box on Home (tasks, fixed times, sleep) and I will plan it.';ch.push({l:'Open the planner',f:()=>{S.stage='plan';render()}})}}
  if(/right now|what should i do|do next|what next/.test(s)){const n=pend.find(i=>i.start+i.dur>mm)||pend[0];msg=n?`${n.title} (${fmt(n.start)}, ${dur(n.dur)}) is next.`:'No open tasks.'}
  if(/schedule/.test(s)&&/tell|read|show|today/.test(s)&&!ch.length)msg=S.items.length?S.items.slice(0,8).map(i=>fmt(i.start)+' '+i.title).join('; ')+'.':'No plan yet.';
  if(/missed|reschedule my/.test(s)&&miss.length)ch.push({l:'Re-place: '+miss.map(i=>i.title).join(', '),f:()=>{miss.forEach(i=>i.status='pending');repack(0,new Set(miss.map(i=>i.id)));S.carry=S.carry.filter(c=>!miss.some(i=>i.title===c.title))}});
  if(/analy|why am i|not completing/.test(s)){const P=pats();msg=P.n<3?'I need at least 3 logged days to see patterns.':P.out.join(' ')||'No clear pattern yet.'}
  if(dm&&/goal|plan|learn|want|achieve/.test(s)){const g=goalFrom(q);ch.push({l:`Create goal "${g.title}" with ${g.ms.length} ${g.days>=60?'monthly':'weekly'} milestones`,f:()=>{addGoal(g);S.stage='goals'}})}
  if(!ch.length&&!msg)msg='I can move a task ("move project to 6 PM"), shorten one ("reduce exercise to 30 minutes"), handle lateness ("I woke up 2 hours late"), or trim your day ("I have only 4 hours"). I could not match that request.';
  return{msg,ch}}
const cd=document.createElement('div');cd.id='coach';cd.hidden=true;cd.innerHTML=`<div class="top"><h3>Ask DayFlow</h3><button id="cx" aria-label="Close">✕</button></div><p class="d">Rule-based assistant working on your current plan. It proposes changes and waits for you to apply them.</p><textarea id="cq" style="min-height:70px" placeholder="Move mathematics to 6 PM, or: I woke up 2 hours late"></textarea><div class="row"><button class="p" id="cg">Ask</button><button onclick="voice('cq',this)">🎤 Speak</button></div><div id="cr"></div>`;document.body.appendChild(cd);
let pend=[];
$('#cx').onclick=()=>cd.hidden=true;
$('#cg').onclick=()=>{const q=$('#cq').value.trim();if(!q)return;if(!S.items.length&&!/plan|goal|learn|want/i.test(q)){$('#cr').innerHTML='<p class="d">Create a plan first, then I can adjust it.</p>';return}
  const r=ask(q);pend=r.ch;$('#cr').innerHTML=(r.msg?`<p>${esc(r.msg)}</p>`:'')+(r.ch.length?`<div class="card"><h3>Plan changes</h3><ul class="d">${r.ch.map(c=>`<li>${esc(c.l)}</li>`).join('')}</ul><div class="row"><button class="p" id="ca">Apply changes</button><button id="cn">Dismiss</button></div></div>`:'');
  if(r.ch.length){$('#ca').onclick=()=>{pend.forEach(c=>c.f());save();render();cd.hidden=true;$('#cr').innerHTML='';$('#cq').value='';toast('Plan updated')};$('#cn').onclick=()=>$('#cr').innerHTML=''}};
const fab=document.createElement('button');fab.className='fab';fab.textContent='✨ Ask DayFlow';fab.onclick=()=>{cd.hidden=false;$('#cq').focus()};document.body.appendChild(fab);
const nv=document.createElement('nav');nv.setAttribute('aria-label','Main');document.body.appendChild(nv);
const _r=render;render=function(){applyTheme();_r();nv.innerHTML=[['plan','Home'],['exec','Today'],['cal','Calendar'],['goals','Goals'],['insights','Insights'],['settings','Settings']].map(([k,l])=>`<button class="${S.stage===k||(k==='plan'&&S.stage==='review')?'on':''}" onclick="go('${k}')">${l}</button>`).join('')};
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
